version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      aspire:
        patterns: ["Aspire.*"]
      microsoft:
        patterns: ["Microsoft.*", "System.*"]
      mediator:
        patterns: ["Mediator.*"]
      telemetry:
        patterns: ["OpenTelemetry.*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
